[package]
name = "zenith-core"
version = "0.1.0"
edition = "2021"
authors = ["Derk <github.com/derk>"]
description = "Zero-allocation WebAssembly game state machines and audio DSP for Zenith Offline"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
